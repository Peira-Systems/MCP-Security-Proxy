services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mcp_proxy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-mcp_proxy}
    volumes:
      - pg_data:/var/lib/postgresql/data
    # Published for local psql / running `mix` against it; the app reaches
    # postgres over the compose network and does not need this.
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mcp_proxy}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: mcp-security-proxy:latest
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      PORT: ${PORT:-4000}
      DATABASE_URL: postgres://${POSTGRES_USER:-mcp_proxy}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-mcp_proxy}
      # Off-DB audit-chain checkpoint — a volume separate from Postgres.
      AUDIT_CHECKPOINT_PATH: /checkpoints/audit.log
      # Lets a registered `localhost` / `127.0.0.1` MCP server URL (e.g. the
      # JetBrains IDE plugin on the host) be reached from inside the container.
      MCP_HOST_LOOPBACK_ALIAS: host.docker.internal
    ports:
      - "${PORT:-4000}:${PORT:-4000}"
    volumes:
      - audit_checkpoints:/checkpoints
    # Makes `host.docker.internal` resolve to the host. Automatic on Docker
    # Desktop; declared here so it also works on plain Docker Engine / Linux.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${PORT:-4000}/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

volumes:
  pg_data:
  audit_checkpoints:
