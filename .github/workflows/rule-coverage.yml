name: Rule coverage

# Runs `mix mcp.rules.check` (see docs/superpowers/specs/2026-09-30-rule-coverage-gate-design.md)
# against a database and fails if any registered tool's sensitive tags
# aren't actually enforced by the RuleEngine config.
#
# This repo has no staging DB secret configured in CI (only GITHUB_TOKEN
# and ANTHROPIC_API_KEY exist — checked against ci.yml, security-review.yml,
# and release.yml). Rather than invent one, this job points at the same
# ephemeral Postgres service container ci.yml's `test` job spins up for
# `mix test`, and seeds it with one real, representative registration via
# `mix mcp.rules.seed_fixtures` (registers `PhoenixElxirBeam.MCP.
# CiFixtureServer`'s 3-tool catalog through a genuine handshake, then tags
# the two sensitive tools as an operator would). That makes this a real
# regression test: `MCP_RULE_COVERAGE_EXTRA_RULE` below gives
# `mix mcp.rules.check` one extra rule covering that seeded catalog (see
# `config/runtime.exs` for why this lives in an env var rather than
# `config/test.exs` — the shared test config can't carry it without
# breaking unrelated tests that reuse the same tool names), so a correctly-
# configured run finds zero gaps. If a future config edit stops covering
# `read_secrets`/`post_webhook`, this job is what turns red.
#
# `test/support/generated_rule_fixtures.ex` is intentionally NOT committed
# to the repo (see Task 5's ruling) — it's a regenerated-every-run, human-
# readable report of the gaps found, not a tracked artifact to diff against.
# There is deliberately no "drift detection" step comparing it to a
# committed copy; instead this job uploads it as a build artifact (below)
# so a human can download and inspect it after any run.

on:
  pull_request:
  push:
    branches: [main, master]

concurrency:
  group: rule-coverage-${{ github.ref }}
  cancel-in-progress: true

env:
  ELIXIR_VERSION: "1.18.5"
  OTP_VERSION: "27.3.4.17"
  MIX_ENV: test
  ImageOS: ubuntu26

jobs:
  rule-coverage:
    name: rule coverage check
    runs-on: self-hosted

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Restore deps / build cache
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-${{ runner.environment }}-mix-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.environment }}-mix-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-

      - run: mix deps.get
      - run: mix ecto.create
      - run: mix ecto.migrate

      - name: Seed a representative server registration
        run: mix mcp.rules.seed_fixtures

      - name: Run rule coverage check
        run: mix mcp.rules.check
        env:
          MCP_RULE_COVERAGE_EXTRA_RULE: >-
            {"match": {"tool_tags_any": ["sensitive_read", "network_egress"]},
             "action": "deny", "reason": "CI fixture coverage baseline"}

      - name: Upload generated rule fixtures report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-rule-fixtures
          path: test/support/generated_rule_fixtures.ex
