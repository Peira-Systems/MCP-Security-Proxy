name: CI

on:
  pull_request:
  push:
    branches: [main, master]

# One in-flight run per ref; a new push cancels the previous.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep in sync with the Dockerfile's ELIXIR_VERSION / OTP_VERSION.
  ELIXIR_VERSION: "1.18.5"
  OTP_VERSION: "27.3.4.17"
  MIX_ENV: test
  # Self-hosted runners don't set ImageOS; erlef/setup-beam needs it to pick
  # the prebuilt OTP/Elixir. Match the runner's Ubuntu release.
  ImageOS: ubuntu26

jobs:
  test:
    name: compile · format · audit · test
    runs-on: self-hosted

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Restore deps / build cache
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-${{ runner.environment }}-mix-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.environment }}-mix-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-

      - run: mix deps.get

      - run: mix deps.unlock --check-unused

      - run: mix format --check-formatted

      - run: mix compile --warnings-as-errors

      - name: Dependency audit
        run: |
          mix deps.audit
          mix hex.audit

      - run: mix test

      # Catch prod-only config / compile breakage (runtime.exs, prod.exs,
      # force_ssl, releases) that MIX_ENV=test never exercises.
      - name: Prod build compiles
        run: MIX_ENV=prod mix compile --warnings-as-errors

      # Similarity-layer dependencies and model files (2026-10-05 plan)
      # -- must be present before any step below that imports
      # prompt_injection_scanner (score_injection.py calls scan_text,
      # which now includes the similarity stage).
      - name: Install sidecar Python dependencies
        run: pip3 install --break-system-packages --no-cache-dir -r priv/plugins/requirements.txt

      - name: Fetch and verify similarity model files
        run: |
          mkdir -p priv/plugins/model
          curl -sL -o priv/plugins/model/model.onnx \
            https://huggingface.co/sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2/resolve/main/onnx/model.onnx
          curl -sL -o priv/plugins/model/tokenizer.json \
            https://huggingface.co/sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2/resolve/main/tokenizer.json
          echo "10f7a088420252b26caf819236ca2c9d2987afd0fc06fec7553b542a5655a05a  priv/plugins/model/model.onnx" | sha256sum -c -
          echo "2c3387be76557bd40970cec13153b3bbf80407865484b209e655e5e4729076b8  priv/plugins/model/tokenizer.json" | sha256sum -c -

      # Prompt-injection ruleset vs the labelled corpus (M4.3) — fails if recall
      # or the false-positive rate falls outside budget. See docs/injection-detection.md.
      - name: Injection ruleset score
        run: python3 priv/plugins/score_injection.py

      # Unit tests for the normalization-transform functions
      # (strip_zero_width, fold_confusables, strip_artificial_spacing,
      # try_base64_segments) added by the 2026-10-04 normalization-closure
      # plan. Catches a regression to any of these even in cases where the
      # corpus-level budget gate above wouldn't notice (e.g. a row that
      # happens to already be caught by an unrelated rule).
      - name: Normalization transform unit tests
        run: python3 priv/plugins/test_normalization_transforms.py

      - name: Similarity layer unit tests
        run: python3 priv/plugins/test_similarity_layer.py

      - name: Similarity layer calibration regression
        run: python3 priv/plugins/test_similarity_calibration.py


  dialyzer:
    name: dialyzer
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Restore deps / build cache
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-${{ runner.environment }}-mix-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.environment }}-mix-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-

      - run: mix deps.get

      - name: Restore Dialyzer PLT
        uses: actions/cache@v4
        with:
          path: priv/plts
          key: ${{ runner.os }}-${{ runner.environment }}-plt-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.environment }}-plt-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-

      - name: Build PLT (if cache missed)
        run: mix dialyzer --plt

      - run: mix dialyzer --format github
