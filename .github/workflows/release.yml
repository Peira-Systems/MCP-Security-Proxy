name: Release image

# Build and push the runtime image when a version tag is pushed:
#   git tag v0.2.0 && git push origin v0.2.0
# It can also be run by hand from the Actions tab (workflow_dispatch) against
# any ref — the image is then tagged only `:<short-sha>` (no `:latest`, which is
# reserved for tag builds).
#
# The image is published to `${REGISTRY_HOST}/mcp-security-proxy` over HTTPS.
# Configure it in the repo settings (Settings → Secrets and variables → Actions):
#   - variable REGISTRY_HOST      e.g. artifact-keeper.peirasystems.com
#   - secret   REGISTRY_USER
#   - secret   REGISTRY_PASSWORD
# Deploying the image onto the node is a manual step on the host — see
# docs/ci-cd.md (deploy + rollback).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  IMAGE: ${{ vars.REGISTRY_HOST }}/mcp-security-proxy

jobs:
  build-push:
    # Self-hosted runner that can reach the registry host.
    runs-on: self-hosted
    permissions:
      contents: read

    steps:
      - name: Check registry config
        env:
          REGISTRY_HOST: ${{ vars.REGISTRY_HOST }}
        run: |
          test -n "$REGISTRY_HOST" \
            || { echo "::error::repo variable REGISTRY_HOST is not set"; exit 1; }

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to the registry
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.REGISTRY_HOST }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=,format=short
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Re-fetch every pushed tag from the registry and assert it resolves to the
      # digest we just built — proves the push actually landed, not just that the
      # client reported success.
      - name: Verify pushed tags
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          EXPECTED: ${{ steps.build.outputs.digest }}
        run: |
          echo "expected digest: $EXPECTED"
          rc=0
          for tag in $TAGS; do
            got=$(docker buildx imagetools inspect "$tag" --format '{{.Manifest.Digest}}') || { echo "::error::$tag — inspect failed"; rc=1; continue; }
            if [ "$got" = "$EXPECTED" ]; then
              echo "ok   $tag -> $got"
            else
              echo "::error::$tag -> $got (expected $EXPECTED)"; rc=1
            fi
          done
          exit $rc
