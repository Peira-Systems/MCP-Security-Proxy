name: Release image

# Build and push the runtime image when a version tag is pushed:
#   git tag v0.2.0 && git push origin v0.2.0
# It can also be run by hand from the Actions tab (workflow_dispatch) against
# any ref — the image is then tagged only `:<short-sha>` (no `:latest`, which is
# reserved for tag builds).
#
# The image is published to GHCR at `ghcr.io/<owner>/<repo>`, authenticated
# with the workflow's own GITHUB_TOKEN (no repo secrets to configure). The
# package inherits the repo's visibility on GHCR; make it public under the
# package's own settings if pulls shouldn't require auth.
# Deploying the image onto the node is a manual step on the host — see
# docs/ci-cd.md (deploy + rollback).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-push:
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR requires an all-lowercase path; github.repository preserves case.
      - name: Set image name
        run: echo "IMAGE=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=,format=short
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Re-fetch every pushed tag from the registry and assert it resolves to the
      # digest we just built — proves the push actually landed, not just that the
      # client reported success.
      - name: Verify pushed tags
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          EXPECTED: ${{ steps.build.outputs.digest }}
        run: |
          echo "expected digest: $EXPECTED"
          rc=0
          for tag in $TAGS; do
            got=$(docker buildx imagetools inspect "$tag" --format '{{.Manifest.Digest}}') || { echo "::error::$tag — inspect failed"; rc=1; continue; }
            if [ "$got" = "$EXPECTED" ]; then
              echo "ok   $tag -> $got"
            else
              echo "::error::$tag -> $got (expected $EXPECTED)"; rc=1
            fi
          done
          exit $rc
