global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert.rules.yml

scrape_configs:
  - job_name: mcp-security-proxy
    metrics_path: /metrics
    static_configs:
      - targets: ["app:4000"]
    # If METRICS_TOKEN is set on the app, uncomment and point at a file
    # containing the token:
    # authorization:
    #   type: Bearer
    #   credentials_file: /etc/prometheus/metrics_token

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
